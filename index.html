<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daily Flowers</title>
    <meta name="description" content="A fresh ASCII bouquet every morning, with a sweet note for every part of the day." />
    <meta property="og:title" content="Daily Flowers" />
    <meta property="og:description" content="A fresh ASCII bouquet every morning, with a sweet note for every part of the day." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💐</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-period="morning">
    <div class="sky" aria-hidden="true">
      <div class="orb"></div>
      <div class="stars"></div>
    </div>

    <main class="card">
      <header>
        <p class="date" id="date"></p>
        <h1 id="greeting">Good morning</h1>
        <p class="note" id="note"></p>
      </header>

      <figure class="bouquet">
        <div class="stage" id="stage">
          <canvas id="glow" aria-hidden="true"></canvas>
          <canvas id="art" role="img"></canvas>
        </div>
        <figcaption id="caption"></figcaption>
      </figure>

      <footer>
        <span>A new bouquet blooms every morning</span>
        <button type="button" id="copy">copy bouquet</button>
      </footer>
    </main>

    <noscript><p class="noscript">Turn on JavaScript to see today's bouquet.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
