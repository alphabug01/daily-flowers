<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flower · Daily Flowers</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="scroll locked" data-period="morning">
    <div class="sky" aria-hidden="true">
      <div class="orb"></div>
      <div class="stars"><span></span><span></span><span></span></div>
    </div>

    <main class="card">
      <a class="back" href="florist.html">← florist</a>
      <div class="detail">
        <figure class="bouquet">
          <div class="stage" id="stage">
            <canvas id="glow" class="glow" aria-hidden="true"></canvas>
            <canvas id="art" class="art" role="img"></canvas>
          </div>
          <figcaption id="caption"></figcaption>
        </figure>

        <section class="options">
          <h1 id="name"></h1>
          <p class="chosen" id="chosen"></p>

          <h2 id="colour-label">Colour</h2>
          <div class="swatches" id="varieties" role="group" aria-labelledby="colour-label"></div>

          <h2 id="mix-label">Mixes</h2>
          <div class="swatches" id="mixes" role="group" aria-labelledby="mix-label"></div>

          <h2 id="time-label">Time of day</h2>
          <div class="times" id="times" role="group" aria-labelledby="time-label"></div>

          <div class="actions">
            <button type="button" id="copy">copy bouquet</button>
          </div>
        </section>
      </div>
    </main>

    <noscript><p class="noscript">Turn on JavaScript to see this flower.</p></noscript>
    <script type="module" src="js/flower.js"></script>
  </body>
</html>
